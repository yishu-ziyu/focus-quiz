<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Focus Quiz - Settings</title>
  <style>
    :root {
      --paper: #fbfaf6;
      --paper-deep: #f3efe4;
      --ink: #211d18;
      --ink-soft: #5d554a;
      --ink-muted: #8a8172;
      --rule: #d8d0bf;
      --rule-strong: #b9ad98;
      --accent: #7b1e28;
      --accent-blue: #305f8f;
      --accent-green: #3f6b4f;
      --serif: "Songti SC", "Noto Serif CJK SC", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--sans);
      padding: 24px;
      max-width: 560px;
      margin: 0 auto;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(123, 30, 40, 0.05) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, #f0eadc 0%, #e7dfcf 100%);
    }
    .card {
      position: relative;
      background:
        linear-gradient(90deg, rgba(123, 30, 40, 0.10) 44px, transparent 44px),
        linear-gradient(180deg, rgba(255,255,255,0.58), rgba(255,255,255,0.16)),
        var(--paper);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 24px;
      box-shadow: 0 14px 32px rgba(52, 42, 27, 0.10);
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(184, 171, 146, 0.18) 32px);
      opacity: 0.45;
    }
    .card > * { position: relative; z-index: 1; }
    h1 { font-family: var(--serif); font-size: 28px; line-height: 1.08; margin-bottom: 8px; font-weight: 700; letter-spacing: 0; }
    p.desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; line-height: 1.6; }
    label { display: block; font-family: var(--serif); font-size: 14px; font-weight: 700; margin-bottom: 7px; color: var(--ink); }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 14px;
      font-family: inherit;
      background: rgba(255,255,255,0.58);
      color: var(--ink);
    }
    input[type="password"] { font-family: var(--mono); }
    select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    button.save {
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 10px 16px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    button.save:hover { background: var(--accent); }
    #status { margin-top: 12px; font-size: 12px; text-align: center; min-height: 18px; }
    .status-ok { color: var(--accent-green); }
    .status-err { color: var(--accent); }
    .hint { font-size: 11px; color: var(--ink-muted); margin-top: -10px; margin-bottom: 14px; line-height: 1.55; }
    .divider { border: none; border-top: 1px solid var(--rule); margin: 17px 0; }
    .provider-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
      background: rgba(255,255,255,0.45);
      border: 1px solid var(--rule);
      color: var(--ink-soft);
    }
    .badge.global { color: var(--accent-blue); border-color: #b7c5d4; }
    .badge.cn { color: #8a5b18; border-color: #d7c28f; }
    .badge.gateway { color: #5a3c86; border-color: #c6b9d6; }
    .badge.coding { color: var(--accent); border-color: #d8aba9; }
    .badge.local { color: var(--accent-green); border-color: #b9cdbd; }
    .badge.custom { color: var(--ink-soft); }
    .doc-link { font-size: 12px; color: var(--accent-blue); text-decoration: underline; }
    .security-note { margin-top: 16px; font-size: 11px; color: var(--ink-muted); text-align: center; line-height: 1.55; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Settings</h1>
    <p class="desc">选择模型服务并配置密钥。除了内置预设，你也可以接入任意 OpenAI-Compatible 网关、Token Plan 或 Coding Plan。</p>

    <label for="providerSelect">模型服务</label>
    <select id="providerSelect"></select>

    <div class="provider-meta">
      <span id="providerRegion" class="badge"></span>
      <span id="providerProtocol" class="badge"></span>
      <a id="providerDoc" class="doc-link" href="#" target="_blank" rel="noreferrer">文档</a>
    </div>

    <hr class="divider">

    <div id="baseUrlGroup">
      <label for="baseUrlInput">Base URL</label>
      <input type="text" id="baseUrlInput" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false">
      <p class="hint">自定义 OpenAI-Compatible 服务只填根地址，通常不要包含 <code>/chat/completions</code>。</p>
    </div>

    <div id="apiKeyGroup">
      <label for="apiKeyInput">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="API Key..." autocomplete="off" spellcheck="false">
    </div>

    <div id="modelSelectGroup">
      <label for="modelSelect">模型</label>
      <select id="modelSelect"></select>
      <p class="hint">模型列表是内置快照，若服务商已发布新模型，请选择“手动输入模型 ID”。</p>
    </div>

    <div id="customModelGroup">
      <label for="customModelInput">模型 ID</label>
      <input type="text" id="customModelInput" placeholder="model-id" autocomplete="off" spellcheck="false">
    </div>

    <button class="save" id="saveBtn">保存配置</button>
    <div id="status"></div>

    <div class="security-note">
      API Key 仅存储在浏览器本地。选中文本会发送给你当前选择的模型服务商。
    </div>
  </div>

  <script src="provider-presets.js"></script>
  <script src="options.js"></script>
</body>
</html>
