<!DOCTYPE html>
<html>

<head>
    <title>Focus Quiz Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-white font-sans p-10 max-w-lg mx-auto text-zinc-900">
    <h1 class="text-xl font-semibold mb-6 tracking-tight">Settings</h1>

    <div class="border border-zinc-200 rounded-xl p-6 shadow-sm">
        <!-- Provider -->
        <div class="mb-5">
            <label for="provider" class="block text-sm font-medium text-zinc-700 mb-2">AI Provider</label>
            <select id="provider" class="w-full px-3 py-2.5 border border-zinc-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent transition-all">
                <option value="openai">OpenAI</option>
                <option value="gemini">Google Gemini</option>
                <option value="minimax">MiniMax</option>
            </select>
        </div>

        <!-- API Key -->
        <div class="mb-6">
            <label for="apiKey" class="block text-sm font-medium text-zinc-700 mb-2">API Key</label>
            <input type="password" id="apiKey" placeholder="sk-..." class="w-full px-3 py-2.5 border border-zinc-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent transition-all" />
            <p class="text-xs text-zinc-400 mt-2">Your key is stored locally on your device.</p>
        </div>

        <!-- Save Button -->
        <button id="save" class="w-full bg-zinc-900 text-white py-2.5 px-4 rounded-lg text-sm font-medium hover:bg-zinc-800 transition-colors">
            Save Settings
        </button>

        <!-- Status -->
        <div id="status" class="mt-3 text-center text-sm h-5"></div>
    </div>

    <script src="options.js"></script>
</body>

</html>
