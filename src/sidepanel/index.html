<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Focus Quiz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Custom animations not in Tailwind */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-slow {
        animation: spin 1s linear infinite;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-in forwards;
      }
    </style>
  </head>

  <body class="bg-white text-zinc-900 font-sans p-4 min-h-screen">
    <!-- Header -->
    <header class="flex items-center gap-3 pb-4 mb-6 border-b border-zinc-200">
      <img src="../../assets/icons/icon48.png" alt="Logo" class="w-6 h-6" />
      <div>
        <h1 class="text-lg font-semibold tracking-tight">Focus Quiz</h1>
        <p class="text-xs text-zinc-500">Select text to generate a quiz</p>
      </div>
    </header>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-16 text-zinc-500">
      <span class="text-5xl mb-4 block">📝</span>
      <p class="text-sm">
        Select text on any webpage → Right Click →
        <span class="font-medium text-zinc-700">"Generate Quiz"</span>
      </p>
    </div>

    <!-- Loading State -->
    <div
      id="loading"
      class="hidden flex-col items-center justify-center py-16 text-center"
    >
      <div
        class="w-8 h-8 border-2 border-zinc-200 border-t-zinc-900 rounded-full animate-spin-slow mb-4"
      ></div>
      <p class="text-sm font-medium text-zinc-700">Generating Quiz...</p>
      <p class="text-xs text-zinc-400 mt-1" id="loading-detail">
        Reading context...
      </p>
    </div>

    <!-- Error Message -->
    <div
      id="error-message"
      class="hidden mt-4 p-4 bg-zinc-100 border border-zinc-200 rounded-lg text-sm text-zinc-700"
    ></div>

    <!-- Quiz Container -->
    <div id="quiz-container" class="hidden flex-col gap-4">
      <!-- Questions injected here -->
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
